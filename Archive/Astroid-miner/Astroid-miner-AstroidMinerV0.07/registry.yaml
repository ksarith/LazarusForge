# Machine-readable source of truth for Astroid Miner's epistemic registry.
# REGISTRY.md and MODELS.md remain the human-readable documents; this file
# exists so tools/validate_registry.py can catch drift between what those
# documents claim and what the repository actually contains (missing files,
# duplicate model IDs, EXEC-FULL claims without a backing test, deprecated
# files still imported by production code).
#
# Schema:
#   path: relative path from repo root (required, must exist on disk)
#   type: CONCEPT | MODEL | ENGINEERING | GOVERNANCE | HISTORICAL_RAW | BUILD
#   authority: AUTHORITATIVE-DRAFT | AUTHORITATIVE-MODEL | EXPLORATORY | DEPRECATED | LEGACY-LINEAGE
#   validation: UNVALIDATED | PARTIALLY-VALIDATED | BENCHMARKED | PEER-REVIEWED
#   executability: EXEC-FULL | EXEC-PARTIAL | INERT-SKETCH | N/A
#   parameter_status: PROVENANCED | PARTIALLY-PROVENANCED | UNPROVENANCED | N/A
#   model_id: optional, e.g. MDL-SWR-03 (only for entries with a Model ID in MODELS.md)
#   test_ref: optional, required by the validator whenever executability is EXEC-FULL
#             or EXEC-PARTIAL — format "path/to/test_file.py::test_function_name"
#   notes: optional free text

